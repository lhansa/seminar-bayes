name: Publish slides

# El job `build` es el que clona check-render.yml para comprobar el render en las PR.
# Si cambia el entorno de aquí (Python, dependencias del sistema, Quarto, la caché de
# _freeze/), cambia también el de allí, o la PR saldrá verde y el merge rojo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies (backend C de PyTensor)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libopenblas-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # El muestreo MCMC es lo caro del render. Con freeze: auto, Quarto reutiliza
      # los resultados mientras no cambie el código de las celdas.
      #
      # Sin `restore-keys` a propósito: Quarto invalida _freeze/ por el hash del código de
      # la celda, no por lo que esa celda importa. Un cambio en src/ (el estilo de las
      # figuras, por ejemplo) no toca ni una línea de index.qmd, así que con una caché vieja
      # restaurada por prefijo se publicarían las figuras de antes. Sin fallback, cualquier
      # cambio en index.qmd, src/ o requirements.txt fuerza el render completo: son los ~45 s
      # de MCMC que ya cuesta la primera vez.
      - name: Restore Quarto freeze cache
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('index.qmd', 'src/**', 'requirements.txt') }}

      - name: Render slides
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
